<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Toy Store - ورود</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- فرم ورود -->
      <div class="left-side">
        <div class="form-content">
          <h2>Toy Store</h2>
          <p>به دنیای شاد و رنگی خوش آمدید!</p>
          <form>
            <div class="input-group">
              <label>ایمیل یا شماره موبایل</label>
              <input type="text" placeholder="example@toystore.com" />
            </div>
            <div class="input-group">
              <label>رمز عبور</label>
              <input type="password" placeholder="رمز عبور" />
            </div>
            <button class="submit-btn">ورود به فروشگاه</button>
          </form>
        </div>
      </div>

      <!-- تصویر سمت راست -->
      <div class="right-side">
        <img src="jungle.png" alt="Jungle Theme" />
      </div>
    </div>

    <!--تصویر-->
    <script src="script.js"></script>
  </body>
</html>
